name: Windows retention diagnostics

on:
  workflow_dispatch:
    inputs:
      qualification:
        description: Disposable retention diagnostic; not delivery qualification
        type: choice
        required: true
        default: guild-execution
        options: [guild-execution]

permissions:
  contents: read

concurrency:
  group: windows-retention-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sdk:
    uses: ./.github/workflows/resolve-dotnet-sdk.yml

  retention:
    name: Windows retention diagnostic
    needs: sdk
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet
        with:
          sdk-version: ${{ needs.sdk.outputs.version }}
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            **/*.csproj
            **/Directory.Packages.props

      - name: Reproduce reset conflicts with failure-only diagnostics
        run: |
          set -euo pipefail
          results=.tmp/retention-diagnostic
          mkdir -p "$results"
          dotnet --info > "$results/sdk-info.txt"
          git rev-parse HEAD > "$results/commit.txt"
          git status --porcelain --untracked-files=all > "$results/worktree-status.txt"
          dotnet test tests/RetroDownfall.Arcanum.Tests/RetroDownfall.Arcanum.Tests.csproj -c Release --filter 'FullyQualifiedName~DataRetentionLogInventoryTests' --blame-hang-timeout 5m --blame-hang-dump-type none --logger 'trx;LogFileName=retention-1.trx' --logger 'console;verbosity=normal' --results-directory "$results"
          for ((iteration=2;iteration<=40;iteration++)); do
            dotnet test tests/RetroDownfall.Arcanum.Tests/RetroDownfall.Arcanum.Tests.csproj -c Release --no-build --no-restore --filter 'FullyQualifiedName~DataRetentionLogInventoryTests' --blame-hang-timeout 5m --blame-hang-dump-type none --logger "trx;LogFileName=retention-${iteration}.trx" --logger 'console;verbosity=normal' --results-directory "$results"
          done

      - name: Upload retention diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: retention-diagnostic-windows-latest
          path: .tmp/retention-diagnostic/
          if-no-files-found: error
          retention-days: 14
