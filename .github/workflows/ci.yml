          dotnet test tests/RetroDownfall.Compendium.Tests/RetroDownfall.Compendium.Tests.csproj `
            -c Release --no-build --no-restore --blame-hang-timeout 15m --blame-hang-dump-type none --filter "FullyQualifiedName=RetroDownfall.Compendium.Ux.Tests.Compendium.ConfigurationStoreSmokeTests.WriteAsync_hardens_the_destination_that_arrived_with_loose_permissions"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  windows-arm64-suite:
    # The release ships win-arm64 alongside win-x64 and osx-arm64: it is built, packaged, signed and
    # handed to operators. Until this lane, not one test had ever executed on it. Three things it
    # reaches that windows-suite cannot, none of which x64 coverage can stand in for:
    #
    #   - A different binary. runtimes/win-arm64/native/e_sqlcipher.dll is its own hermetic build
    #     from the pinned sources, so the Grimoire's every P/Invoke into SQLCipher crosses the arm64
    #     calling convention here for the first time. A marshalling mistake that x64 tolerates --
    #     a struct layout, a blittable assumption, a pointer width taken for granted -- surfaces on
    #     this lane and nowhere else in CI.
    #   - Windows on ARM, not Windows. Credential Manager, Job Objects, AppContainer and the NTFS
    #     ACL surface are reached through the same P/Invoke declarations, on an OS build that runs
    #     x64 code under emulation. That emulation is the local failure mode: it lets a tool answer
    #     confidently about the wrong architecture, which is why build-windows.yml stopped believing
    #     PROCESSOR_ARCHITECTURE and why the SDK assertion below exists.
    #   - The RID's own delivery. This is the only lane that runs the suite with the win-arm64 asset
    #     actually loaded, so the hermetic targets' promise of exactly one library and no fallback is
    #     observed for this RID here rather than inferred from the manifest saying `verified`.
    name: Windows test suite (arm64)
    # Gated on its own RID, not on x64's. The asset statuses are independent -- either can go
    # pending on its own -- and a lane gated on the other architecture's asset would fail at
    # `dotnet build` with ARCSQLC002 rather than skip honestly, which is the property the manifest
    # gate exists to preserve.
    needs: [sdk, native-sqlcipher-assets, scope]
    if: needs.scope.outputs.full == 'true' && inputs.qualification != 'guild-memory' && inputs.qualification != 'guild-budget' && needs.native-sqlcipher-assets.outputs.win-arm64 == 'verified'
    # A whole job rather than a matrix leg of windows-suite, deliberately, for two reasons that both
    # fail silently. `needs:` names a job id and waits for every leg of that job's matrix, so folding
    # arm64 into windows-suite would put this lane behind anything that gates on that job id, without
    # anyone choosing that -- and this lane has never run, so its real failure list is unknown. And a
    # job-level `if:` cannot read the `matrix` context at all, so a matrix could not carry the
    # per-RID manifest gate above without rebuilding it as a dynamically generated matrix. Please do
    # not "simplify" the duplication away without answering both.
    #
    # Each Windows architecture tests on its own architecture for the reason build-windows.yml
    # publishes on its own: `windows-11-arm` is free for this repository because it is public.
    runs-on: windows-11-arm
    # Budget for native ARM64 builds, separate diagnostic and shipping AOT publishes,
    # executable smokes and the Windows/Long Rest suites, with hosted-runner headroom.
    timeout-minutes: 270
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      # Both variables carry over from the x64 lane unchanged, and for unchanged reasons. Without
      # the first, a lane whose Windows-gated tests all skipped reports a clean green while
      # asserting nothing -- see WindowsCiSurfaceTests, which is architecture-agnostic and holds
      # here exactly as it does there. The second opts in to the one test that writes to a real OS
      # secret store; this runner's Credential Manager is as disposable as the x64 runner's, and
      # arm64 is where the store's P/Invoke surface is least exercised, so opting out here would
      # skip the round trip on the architecture that most needs it.
      ARCANUM_REQUIRE_WINDOWS_SUITE: true
      ARCANUM_EXPECTED_WINDOWS_RID: win-arm64
      ARCANUM_TEST_OS_CREDENTIAL_STORE: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet
        with:
          sdk-version: ${{ needs.sdk.outputs.version }}
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            **/*.csproj
            **/Directory.Packages.props
            .config/dotnet-tools.json

      # The SDK's own host RID, because Windows on ARM runs an x64 SDK under emulation without
      # complaining. That degradation is silent in the one direction that matters here: an emulated
      # x64 run resolves the win-x64 native asset, passes every test, and reports arm64 coverage this
      # lane never obtained -- a second copy of windows-suite wearing an arm64 label. Assert it
      # before anything is built rather than inferring it from the runner label, which can be right
      # while the toolchain is not. build-windows.yml makes the same assertion before it publishes.
      - name: Assert the SDK is native to win-arm64
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $info = (& dotnet --info) -join "`n"

          Write-Host $info

          New-Item -ItemType Directory -Force '.tmp/windows-long-rest-win-arm64' | Out-Null
          $info | Set-Content -LiteralPath '.tmp/windows-long-rest-win-arm64/sdk-info.txt' -Encoding utf8

          $match = [regex]::Match($info, '(?m)^\s*RID:\s*(?<rid>\S+)\s*$')

          if (-not $match.Success) {
              throw "dotnet --info did not report a host RID, so this lane cannot tell whether it is testing win-arm64 or an emulated win-x64."
          }

          if ($match.Groups['rid'].Value -ne 'win-arm64') {
              throw "This lane must run a win-arm64 SDK; this runner's host RID is $($match.Groups['rid'].Value), so the suite would exercise win-x64 a second time under emulation."
          }

      - name: Restore and build Arcanum + Compendium
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The same two projects the x64 lane builds, for the same reason: The Forge's suite is
          # platform-agnostic and runs once, on build-test.
          foreach ($project in @(
            'tests/RetroDownfall.Arcanum.Tests/RetroDownfall.Arcanum.Tests.csproj',
            'tests/RetroDownfall.Compendium.Tests/RetroDownfall.Compendium.Tests.csproj'
          )) {
            dotnet restore $project
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            dotnet build $project -c Release --no-restore
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      # The AOT diagnostic gate fails closed when ripgrep is absent. The arm64 runner can execute
      # the pinned fallback under emulation; product tests and publication remain native arm64.
      - name: Install ripgrep
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if (-not (Get-Command rg -CommandType Application -ErrorAction SilentlyContinue)) {
            choco install ripgrep --version=15.2.0 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          rg --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # This must execute on the arm64 SDK asserted above. The shipping publish deliberately uses
      # its warning-free profile, so only this diagnostic profile can reject an arm64-only
      # first-party IL/AOT warning before the product is accepted.
      - name: Audit win-arm64 Native AOT diagnostics
        shell: bash
        run: |
          set -euo pipefail
          rg --version
          ./scripts/verify-aot-il-warnings.sh win-arm64

      - name: Verify Guild Native AOT graph (win-arm64)
        shell: bash
        run: ./scripts/verify-guild-aot.sh --rid win-arm64

      # The broker smoke re-executes this exact retained, warning-free shipping apphost after
      # its provider-contract smoke succeeds. A fresh parent gives the verifier a nonexistent leaf.
      - name: Verify warning-free win-arm64 shipping executable and provider-contract smoke
        shell: bash
        run: |
          set -euo pipefail
          runner_temp="$(cygpath -u "$RUNNER_TEMP")"
          retained_parent="$(mktemp -d "$runner_temp/arcanum-shipping-win-arm64.XXXXXX")"
          retained_publish="$retained_parent/publish"
          ./scripts/verify-shipping-publish.sh --rid win-arm64 --retain-publish-dir "$retained_publish"
          executable="$retained_publish/RetroDownfall.Arcanum.Cli.exe"
          if [[ ! -f "$executable" ]]; then
            echo "error: expected retained shipping apphost not found: $executable" >&2
            exit 1
          fi
          windows_executable="$(cygpath -w "$executable")"
          printf 'ARCANUM_PUBLISHED_EXECUTABLE=%s\n' "$windows_executable" >> "$GITHUB_ENV"

      - name: Test Arcanum
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Same explicit native/OS surface as x64, exercised with the arm64 asset and SDK, including
          # every test that skips unless the host is Windows.
          # The AI reflection guard also inspects this architecture's complete compiled production closure.
          dotnet test tests/RetroDownfall.Arcanum.Tests/RetroDownfall.Arcanum.Tests.csproj `
            -c Release --no-build --no-restore --blame-hang-timeout 15m --blame-hang-dump-type none --filter "Category!=Perf&Category!=HostedProducerAnalysis&(FullyQualifiedName~AiReflection|FullyQualifiedName~RetroDownfall.Arcanum.Tests.Platform.WindowsCiSurfaceTests|FullyQualifiedName~RetroDownfall.Arcanum.Tests.NativeSqlCipher.NativeSqlCipherDeliveryTests|FullyQualifiedName~RetroDownfall.Arcanum.Tests.NativeSqlCipher.SqlCipherCompatibilityTests|FullyQualifiedName~RetroDownfall.Arcanum.Tests.Security.OsCredentialStoreRoundTripTests|FullyQualifiedName~RetroDownfall.Arcanum.Tests.Platform.ProcessResourceLimiterWindowsBehaviorTests|FullyQualifiedName~RetroDownfall.Arcanum.Tests.Platform.WindowsJobObjectSessionTests|FullyQualifiedName~RetroDownfall.Arcanum.Tests.Process.WindowsAppContainerPolicyTests|FullyQualifiedName~RetroDownfall.Arcanum.Tests.Process.WindowsAppContainerRestoreJournalTests|FullyQualifiedName~RetroDownfall.Arcanum.Tests.Process.WindowsAppContainerBrokerTests|FullyQualifiedName~RetroDownfall.Arcanum.Tests.Process.WindowsAppContainerAclTests|FullyQualifiedName~RetroDownfall.Arcanum.Tests.Process.WindowsBrokerTargetResolverTests|FullyQualifiedName~RetroDownfall.Arcanum.Tests.Process.ChildProcessSandboxRootsTests|FullyQualifiedName~RetroDownfall.Arcanum.Tests.Process.WindowsAppContainerJobAssignmentTests|FullyQualifiedName~RetroDownfall.Arcanum.Tests.Process.WindowsAppContainerBrokerExitTests|FullyQualifiedName~RetroDownfall.Arcanum.Tests.Process.WindowsAppContainerRootLockBudgetTests|FullyQualifiedName~RetroDownfall.Arcanum.Tests.Process.ChildProcessBoundaryBehaviorTests|FullyQualifiedName~RetroDownfall.Arcanum.Tests.Process.ChildProcessFilesystemJailTests|FullyQualifiedName~RetroDownfall.Arcanum.Tests.Process.CappedChildProcessRunnerStandardInputTests|FullyQualifiedName~RetroDownfall.Arcanum.Tests.Familiars.FamiliarExecutableResolverTests|FullyQualifiedName~RetroDownfall.Arcanum.Tests.Intelligence.Spells.SpellDirectoryTests|FullyQualifiedName~RetroDownfall.Arcanum.Tests.Repositories.SpellRepositoryTests|FullyQualifiedName~RetroDownfall.Arcanum.Tests.Workspaces.SpellScannerTests|FullyQualifiedName=RetroDownfall.Arcanum.Tests.GrimoireTransitions.GrimoireOfflineTransitionJournalFileStoreTests.Windows_delete_durably_succeeds_after_publication|FullyQualifiedName=RetroDownfall.Arcanum.Tests.GrimoireTransitions.GrimoireOfflineTransitionJournalFileStoreTests.Windows_read_fails_closed_when_the_published_file_acl_is_weakened|FullyQualifiedName=RetroDownfall.Arcanum.Tests.Cli.FullInstallationResetAttestationFileReaderTests.Reader_rejects_a_file_not_controlled_only_by_the_current_owner|FullyQualifiedName=RetroDownfall.Arcanum.Tests.Mcp.WorkspacePathPolicySymlinkTests.IsPathUnderWorkspace_OnWindows_IgnoresDirectoryNameCase|FullyQualifiedName=RetroDownfall.Arcanum.Tests.Platform.ProcessResourceLimiterTests.Apply_returns_assign_after_start_on_windows|FullyQualifiedName=RetroDownfall.Arcanum.Tests.Security.HttpsCertificateLoaderTests.Load_PemPair_OnWindows_ZeroesTheExportedPkcs12Buffer|FullyQualifiedName=RetroDownfall.Arcanum.Tests.Security.SecureFileReaderTests.TryOpenRegularFile_on_windows_rejects_reparse_symlink|FullyQualifiedName=RetroDownfall.Arcanum.Tests.Workspaces.PhysicalFileSystemBrowserTests.ListAsync_And_ReadAsync_NormalizeBackslashesInRelativePaths_OnWindows|FullyQualifiedName=RetroDownfall.Arcanum.Tests.Diagnostics.MaintenanceLockCheckTests.Windows_read_only_stale_lock_is_degraded_and_its_bytes_are_unchanged|FullyQualifiedName=RetroDownfall.Arcanum.Tests.GrimoireTransitions.GrimoireOfflineTransitionJournalFileStoreTests.Windows_compare_unlink_removes_the_name_while_the_retained_evidence_handle_stays_readable|FullyQualifiedName=RetroDownfall.Arcanum.Tests.GrimoireTransitions.GrimoireOfflineTransitionJournalFileStoreTests.Windows_real_primitives_reinspect_then_publish_a_new_working_file|FullyQualifiedName=RetroDownfall.Arcanum.Tests.GrimoireTransitions.GrimoireOfflineTransitionJournalFileStoreTests.Windows_no_replac