          }
          $ids = @($definitions | Where-Object { $_.TestMethod.className -eq 'RetroDownfall.Arcanum.Tests.Platform.WindowsCiSurfaceTests' -and $_.TestMethod.name -eq 'Windows_ci_lane_uses_the_expected_native_runtime_identifier' } | ForEach-Object { $_.id })
          if ($ids.Count -eq 0 -or @($results | Where-Object { $_.testId -in $ids }).Count -eq 0) {
