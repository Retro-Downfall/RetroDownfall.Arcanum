name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-sqlcipher-assets:
    # A RID whose hermetic SQLCipher asset is still `pending` cannot be built at all: the targets
    # raise ARCSQLC002 before CopyFilesToOutputDirectory, deliberately, with no probe and no
    # fallback. Reading the manifest here and gating the platform lanes on the result keeps a lane
    # that cannot possibly build from masquerading as a check that merely happens to be red, and
    # the lane comes back on its own the moment the asset is verified and checked in.
    name: Native SQLCipher asset status
    runs-on: ubuntu-latest
    outputs:
      win-x64: ${{ steps.manifest.outputs.win-x64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Read the native asset manifest
        id: manifest
        run: |
          set -euo pipefail
          package=src/RetroDownfall.Arcanum.NativeSqlCipher
          for rid in win-x64; do
            status=$(jq -r --arg rid "$rid" '.assets[] | select(.rid == $rid) | .status' "$package/native-source-manifest.json")
            path=$(jq -r --arg rid "$rid" '.assets[] | select(.rid == $rid) | .path' "$package/native-source-manifest.json")
            if [[ "$status" == "verified" && -f "$package/$path" ]]; then
              echo "$rid=verified" >> "$GITHUB_OUTPUT"
            else
              echo "$rid=$status" >> "$GITHUB_OUTPUT"
              echo "::warning::No verified hermetic SQLCipher asset for $rid (status: $status). Its CI lane is skipped; build it on a native runner with scripts/build-native-sqlcipher.ps1, verify it with scripts/verify-native-sqlcipher.sh, and check it in."
            fi
          done

  build-test:
    name: Build, test, coverage
    # macOS arm64, not ubuntu: the Grimoire's SQLCipher library is now built by Arcanum and shipped
    # per RID, and Linux is not a shipping RID. A Linux runner has no native asset, so the build
    # fails by design (ARCSQLC002) rather than falling back to an unverified SQLite.
    runs-on: macos-14
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      COVERAGE_LINE_TARGET: "80"
      COVERAGE_BRANCH_TARGET: "70"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            **/*.csproj
            **/Directory.Packages.props
            .config/dotnet-tools.json

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore and build Arcanum + Compendium + The Forge
        run: |
          set -euo pipefail
          # TheForge.Ux (and through it TheForge.Core) is compiled here because both release
          # workflows package and ship it; without this a compile break merges green.
          for project in \
            src/RetroDownfall.Arcanum.Cli/RetroDownfall.Arcanum.Cli.csproj \
            src/RetroDownfall.TheForge.Ux/RetroDownfall.TheForge.Ux.csproj \
            tests/RetroDownfall.Arcanum.Tests/RetroDownfall.Arcanum.Tests.csproj \
            tests/RetroDownfall.Compendium.Tests/RetroDownfall.Compendium.Tests.csproj \
            tests/RetroDownfall.TheForge.Tests/RetroDownfall.TheForge.Tests.csproj
          do
            dotnet restore "$project"
            dotnet build "$project" -c Release --no-restore
          done

      - name: Test Compendium and The Forge
        run: |
          set -euo pipefail
          # Authoritative Arcanum coverage path is coverage.sh below (do not double-run Arcanum.Tests).
          # The Forge's suite is the sole automated guard for a shipped desktop client — including the
          # markdown image loader's SSRF policy — so a whole-project exclusion here is invisible in
          # every test report. Quarantine individual tests with Skip if it ever needs it again.
          dotnet test tests/RetroDownfall.Compendium.Tests/RetroDownfall.Compendium.Tests.csproj -c Release --no-build
          dotnet test tests/RetroDownfall.TheForge.Tests/RetroDownfall.TheForge.Tests.csproj -c Release --no-build

      - name: Arcanum tests + coverage thresholds
        run: |
          python3 -m unittest scripts/coverage_threshold_test.py
          ./scripts/coverage.sh --threshold

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: arcanum-coverage-report
          path: |
            .tmp/coverage/report/
            .tmp/coverage/**/coverage.cobertura.xml
          if-no-files-found: warn
          retention-days: 14

  macos-workspace-check:
    name: macOS workspace-check runtime
    runs-on: macos-14
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      ARCANUM_REQUIRE_MACOS_WORKSPACE_CHECK: true
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            **/*.csproj
            **/Directory.Packages.props
            .config/dotnet-tools.json

      - name: Pin trusted root-owned dotnet host
        run: |
          set -euo pipefail
          test -n "${DOTNET_ROOT:-}"
          sudo rm -rf /opt/dotnet
          sudo mkdir -p /opt/dotnet
          sudo cp -R "$DOTNET_ROOT/." /opt/dotnet/
          sudo chown -R root:wheel /opt/dotnet
          sudo chmod -R go-w /opt/dotnet
          /opt/dotnet/dotnet --info

      - name: Build Arcanum tests
        run: |
          dotnet restore tests/RetroDownfall.Arcanum.Tests/RetroDownfall.Arcanum.Tests.csproj
          dotnet build tests/RetroDownfall.Arcanum.Tests/RetroDownfall.Arcanum.Tests.csproj -c Release --no-restore

      - name: Exercise production workspace-check jail
        run: |
          dotnet test tests/RetroDownfall.Arcanum.Tests/RetroDownfall.Arcanum.Tests.csproj \
            -c Release \
            --no-build \
            --no-restore \
            --filter "FullyQualifiedName~Macos_ci_requires_real_workspace_check_production_surface|FullyQualifiedName~MacOsSandbox_DeniesLaunchServicesBrokerEscape|FullyQualifiedName~Real_dotnet_build_uses_seeded_assets|FullyQualifiedName~Real_dotnet_lint_uses_seeded_project_state|FullyQualifiedName~Real_dotnet_test_uses_seeded_assets|FullyQualifiedName~Ci_has_packaged_sqlcipher_native_asset"

      # verify-aot-il-warnings.sh fails closed without ripgrep, which the runner image does
      # not ship. Install it explicitly rather than letting the gate refuse to run.
      - name: Install ripgrep
        run: command -v rg >/dev/null 2>&1 || brew install ripgrep

      # Without ld64.lld the csproj cannot enable Native AOT on macOS (Apple's ld-prime asserts on
      # the large object file, dotnet/runtime#119380), and the gate quietly degrades to Roslyn
      # analyzer diagnostics with no ILC whole-program analysis. That is a weaker gate that still
      # reports success, so the linker is a hard requirement of this lane rather than a nicety.
      - name: Install LLVM lld so the gate runs real ILC closure analysis
        run: |
          set -euo pipefail
          command -v /opt/homebrew/opt/lld/bin/ld64.lld >/dev/null 2>&1 || brew install lld
          test -x /opt/homebrew/opt/lld/bin/ld64.lld

      - name: Verify macOS AOT IL warnings and search regex smoke
        run: ./scripts/verify-aot-il-warnings.sh

  windows-suite:
    # Every Windows-only test guards itself with Skip.IfNot(OperatingSystem.IsWindows(), ...), so on
    # the Linux and macOS lanes they report green while asserting nothing. Without this job the whole
    # Windows surface -- Credential Manager, Job Objects, AppContainer, PATHEXT resolution, NTFS
    # permissions -- is untested, which is how WindowsOsCredentialStore shipped persisting
    # uninitialized heap in place of the operator's API key.
    name: Windows test suite
    # win-x64 has no verified hermetic SQLCipher asset yet, and the targets refuse to build a RID
    # without one (ARCSQLC002) long before the first test executes. Gate on the manifest so the
    # lane skips honestly instead of failing at `dotnet build`, and returns by itself once the
    # asset lands.
    needs: native-sqlcipher-assets
    if: needs.native-sqlcipher-assets.outputs.win-x64 == 'verified'
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      # Turns a lane that silently skipped everything into a red build. See WindowsCiSurfaceTests.
      ARCANUM_REQUIRE_WINDOWS_SUITE: true
      # The credential round-trip is the one test that writes to a real OS secret store, so it is
      # opt-in and stays off on developer machines. A disposable runner is where it belongs.
      ARCANUM_TEST_OS_CREDENTIAL_STORE: true
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            **/*.csproj
            **/Directory.Packages.props
            .config/dotnet-tools.json

      - name: Restore and build Arcanum + Compendium
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The Forge's suite runs once, on build-test; this lane exists for the Windows-gated
          # Arcanum surface, so re-running a platform-agnostic suite here would buy nothing.
          foreach ($project in @(
            'tests/RetroDownfall.Arcanum.Tests/RetroDownfall.Arcanum.Tests.csproj',
            'tests/RetroDownfall.Compendium.Tests/RetroDownfall.Compendium.Tests.csproj'
          )) {
            dotnet restore $project
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            dotnet build $project -c Release --no-restore
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Test Arcanum
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Category!=Perf: ArcanumPerfBaselineTests measures wall clock against absolute budgets on
          # a shared runner. DESIGN 13.8 calls that harness explicitly not a gate, and coverage.sh
          # excludes it for the same reason -- an unfiltered lane reds on scheduling noise instead.
          dotnet test tests/RetroDownfall.Arcanum.Tests/RetroDownfall.Arcanum.Tests.csproj `
            -c Release --no-build --no-restore --filter "Category!=Perf"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test Compendium
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet test tests/RetroDownfall.Compendium.Tests/RetroDownfall.Compendium.Tests.csproj `
            -c Release --no-build --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  aot-il:
    name: AOT IL warning gate
    # Same reason as build-test: the AOT closure needs the native asset for the RID it publishes.
    runs-on: macos-14
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            **/*.csproj
            **/Directory.Packages.props
            .config/dotnet-tools.json

      # verify-aot-il-warnings.sh fails closed without ripgrep, which the runner image does
      # not ship. Install it explicitly rather than letting the gate refuse to run.
      - name: Install ripgrep
        run: command -v rg >/dev/null 2>&1 || brew install ripgrep

      # Without ld64.lld the csproj cannot enable Native AOT on macOS (Apple's ld-prime asserts on
      # the large object file, dotnet/runtime#119380), and the gate quietly degrades to Roslyn
      # analyzer diagnostics with no ILC whole-program analysis. That is a weaker gate that still
      # reports success, so the linker is a hard requirement of this lane rather than a nicety.
      - name: Install LLVM lld so the gate runs real ILC closure analysis
        run: |
          set -euo pipefail
          command -v /opt/homebrew/opt/lld/bin/ld64.lld >/dev/null 2>&1 || brew install lld
          test -x /opt/homebrew/opt/lld/bin/ld64.lld

      # The gate itself has silent failure modes (a warning misfiled as third-party, an ILC
      # assertion satisfied by another project's log). Test the gate before trusting it; this
      # stubs `dotnet` and compiles nothing.
      - name: Test the AOT IL gate
        run: ./scripts/verify_aot_il_warnings_test.sh

      - name: Verify AOT IL warnings and regex smoke (host RID)
        run: ./scripts/verify-aot-il-warnings.sh
