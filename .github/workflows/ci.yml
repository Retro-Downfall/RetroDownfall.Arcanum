            'RetroDownfall.Arcanum.Tests.Intelligence.LongRestTurnPreparationProtectedTests',
            'RetroDownfall.Arcanum.Tests.Platform.WindowsCiSurfaceTests'
          )
          foreach ($class in $requiredClasses) {
            $ids = @($definitions | Where-Object { $_.TestMethod.className -eq $class } | ForEach-Object { $_.id })
            if ($ids.Count -eq 0 -or @($results | Where-Object { $_.testId -in $ids }).Count -eq 0) {
              throw "Missing executed Long Rest contract class: $class"
            }
          }
          foreach ($fixture in @(
            @{ Class = 'RetroDownfall.Arcanum.Tests.LongRest.LongRestPolicyTests'; Name = 'The_durable_canonical_grammar_matches_an_independently_encoded_fixture' },
            @{ Class = 'RetroDownfall.Arcanum.Tests.Platform.WindowsCiSurfaceTests'; Name = 'Windows_ci_lane_uses_the_expected_native_runtime_identifier' }
          )) {
            $ids = @($definitions | Where-Object { $_.TestMethod.className -eq $fixture.Class -and $_.TestMethod.name -eq $fixture.Name } | ForEach-Object { $_.id })
            if ($ids.Count -eq 0 -or @($results | Where-Object { $_.testId -in $ids }).Count -eq 0) {
              throw "Missing executed native identity or canonical hash-vector contract: $($fixture.Class).$($fixture.Name)"
