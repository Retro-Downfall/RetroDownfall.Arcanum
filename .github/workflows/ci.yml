name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build, test, coverage
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            **/*.csproj
            **/Directory.Packages.props
            .config/dotnet-tools.json

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore and build solution
        run: |
          set -euo pipefail
          dotnet restore RetroDownfall.Arcanum.slnx
          dotnet build RetroDownfall.Arcanum.slnx -c Release --no-restore

      - name: Test Compendium and The Forge
        run: |
          set -euo pipefail
          # Authoritative Arcanum coverage path is coverage.sh below (do not double-run Arcanum.Tests).
          dotnet test tests/RetroDownfall.Compendium.Tests/RetroDownfall.Compendium.Tests.csproj -c Release --no-build
          dotnet test tests/RetroDownfall.TheForge.Tests/RetroDownfall.TheForge.Tests.csproj -c Release --no-build

      - name: Arcanum tests + coverage gates
        run: ./scripts/coverage.sh --threshold

  aot-il:
    name: AOT IL warning gate
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            **/*.csproj
            **/Directory.Packages.props
            .config/dotnet-tools.json

      - name: Verify AOT IL warnings (host RID)
        run: ./scripts/verify-aot-il-warnings.sh
