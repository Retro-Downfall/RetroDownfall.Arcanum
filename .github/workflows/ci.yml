            --filter "(FullyQualifiedName~RetroDownfall.Arcanum.Tests.LongRest.|FullyQualifiedName~RetroDownfall.Arcanum.Tests.Intelligence.LongRest|FullyQualifiedName=RetroDownfall.Arcanum.Tests.Platform.WindowsCiSurfaceTests.Windows_ci_lane_uses_the_expected_native_runtime_identifier)&Category!=Perf&Category!=HostedProducerAnalysis&Category!=LongRestScaleProbe" `
