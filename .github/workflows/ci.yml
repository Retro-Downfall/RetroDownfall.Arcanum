            'RetroDownfall.Arcanum.Tests.LongRest.LongRestMaintenanceTests',
            'RetroDownfall.Arcanum.Tests.LongRest.LongRestSweepRecoveryTests',
            'RetroDownfall.Arcanum.Tests.LongRest.LongRestSchemaEvolutionTests',
            'RetroDownfall.Arcanum.Tests.Intelligence.LongRestProviderCallTests',
