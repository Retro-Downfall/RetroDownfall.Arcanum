name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build, test, coverage
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            **/*.csproj
            **/Directory.Packages.props
            .config/dotnet-tools.json

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore and build Arcanum + Compendium
        run: |
          set -euo pipefail
          # The Forge is temporarily excluded from CI build/test while its suite is repaired.
          # Build the test projects (and Cli) so dependencies are compiled without TheForge.Ux.
          for project in \
            src/RetroDownfall.Arcanum.Cli/RetroDownfall.Arcanum.Cli.csproj \
            tests/RetroDownfall.Arcanum.Tests/RetroDownfall.Arcanum.Tests.csproj \
            tests/RetroDownfall.Compendium.Tests/RetroDownfall.Compendium.Tests.csproj
          do
            dotnet restore "$project"
            dotnet build "$project" -c Release --no-restore
          done

      - name: Test Compendium
        run: |
          set -euo pipefail
          # Authoritative Arcanum coverage path is coverage.sh below (do not double-run Arcanum.Tests).
          # The Forge tests are temporarily skipped in CI.
          dotnet test tests/RetroDownfall.Compendium.Tests/RetroDownfall.Compendium.Tests.csproj -c Release --no-build

      - name: Arcanum tests + coverage gates
        run: ./scripts/coverage.sh --threshold

  aot-il:
    name: AOT IL warning gate
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            **/*.csproj
            **/Directory.Packages.props
            .config/dotnet-tools.json

      - name: Verify AOT IL warnings (host RID)
        run: ./scripts/verify-aot-il-warnings.sh
