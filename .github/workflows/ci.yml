name: Windows ACL regression diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acl-regression:
    name: Windows ACL regression (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, windows-11-arm]
    steps:
      - name: Checkout diagnostic snapshot
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: global.json
      - name: Real Windows ACL regression
        run: dotnet test tests/RetroDownfall.Arcanum.Tests/RetroDownfall.Arcanum.Tests.csproj --configuration Release --filter "FullyQualifiedName~WindowsAppContainerAclTests" --blame-hang-timeout 5m --blame-hang-dump-type none
