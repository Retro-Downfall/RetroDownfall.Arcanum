name: Windows journal diagnostics

on:
  workflow_dispatch:
    inputs:
      qualification:
        description: Disposable journal diagnostic; not delivery qualification
        type: choice
        required: true
        default: guild-execution
        options: [guild-execution]

permissions:
  contents: read

concurrency:
  group: windows-journal-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sdk:
    uses: ./.github/workflows/resolve-dotnet-sdk.yml

  journal:
    name: Windows journal diagnostic
    needs: sdk
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet
        with:
          sdk-version: ${{ needs.sdk.outputs.version }}
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            **/*.csproj
            **/Directory.Packages.props

      - name: Exercise journal recovery and real permission handles
        run: |
          set -euo pipefail
          mkdir -p .tmp/journal-diagnostic
          dotnet --info > .tmp/journal-diagnostic/sdk-info.txt
          git rev-parse HEAD > .tmp/journal-diagnostic/commit.txt
          git status --porcelain --untracked-files=all > .tmp/journal-diagnostic/worktree-status.txt
          dotnet test tests/RetroDownfall.Arcanum.Tests/RetroDownfall.Arcanum.Tests.csproj             -c Release --filter 'FullyQualifiedName~GrimoireOfflineTransitionJournal'             --blame-hang-timeout 5m --blame-hang-dump-type none             --logger 'trx;LogFileName=journal-diagnostic.trx' --logger 'console;verbosity=normal'             --results-directory .tmp/journal-diagnostic

      - name: Upload journal diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: journal-diagnostic-windows-latest
          path: .tmp/journal-diagnostic/
          if-no-files-found: error
          retention-days: 14
