          $results = @($trx.SelectNodes("//*[local-name()='UnitTestResult']"))
          if ($results.Count -eq 0 -or @($results | Where-Object { $_.outcome -ne 'Passed' }).Count -ne 0) {
            throw 'Long Rest qualification requires executed results with zero failures or skips.'
