  static-analysis:
    # These tools ship in the repository, so their own regression tests and checks must run here.
    # This job compiles nothing and runs in under a minute, which is what makes it affordable to gate on.
    name: Formatting and shell lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test the C# blank-line formatter
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Verify C# blank-line formatting
        run: python3 scripts/align_csharp_blanklines.py --repo . --check

      # The runner image ships shellcheck today, but a gate that silently vanishes when the
      # image changes is worse than no gate, so install it when it is missing.
      - name: Install shellcheck
        run: command -v shellcheck >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y shellcheck)

      # -P SCRIPTDIR resolves `source "$SCRIPT_DIR/common.sh"` the way bash will at runtime;
      # find rather than a glob so a script added in a new packaging directory cannot escape.
      - name: Validate shell scripts
        run: |
          set -euo pipefail
          find scripts -name '*.sh' -print0 | xargs -0 shellcheck -x -P SCRIPTDIR

      # Two things nothing else here checks. The `run:` blocks inside a workflow are shell that the
      # find above never sees, because they are not files. And a reusable-workflow call is checked by
      # nothing at all until it is dispatched: a `with:` key the callee does not declare, or an
      # expression referencing a context that is not available where it sits, first shows up as a
      # failed run on the day somebody reaches for a release. actionlint reads both, and hands the
      # embedded scripts to the shellcheck installed above.
      #
      # Installed through the Go module proxy rather than from a release page, so the download is
      # verified against the checksum database instead of trusted for having the right URL.
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Validate workflows
        run: |
          set -euo pipefail
          "$(go env GOPATH)/bin/actionlint"
