            --logger "trx;LogFileName=quantized-search-win-x64.trx" --results-directory .tmp/windows-quantized-search-win-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Every focused fixture must execute on the native RID, with zero failures or skips.
          [xml]$trx = Get-Content -LiteralPath '.tmp/windows-quantized-search-win-x64/quantized-search-win-x64.trx' -Raw
          $results = @($trx.SelectNodes("//*[local-name()='UnitTestResult']"))
          if ($results.Count -eq 0 -or @($results | Where-Object { $_.outcome -ne 'Passed' }).Count -ne 0) {
            throw 'Quantized search qualification requires executed results with zero failures or skips.'
          }
          $definitions = @($trx.SelectNodes("//*[local-name()='UnitTest']"))
          $requiredClasses = @(
