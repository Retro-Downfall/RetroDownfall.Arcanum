name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sdk:
    uses: ./.github/workflows/resolve-dotnet-sdk.yml
  windows-spell-regression:
    needs: sdk
    name: Windows spell reader regression
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ./.github/actions/setup-dotnet
        with:
          sdk-version: ${{ needs.sdk.outputs.version }}
      - name: Build regression tests
        run: dotnet build tests/RetroDownfall.Arcanum.Tests/RetroDownfall.Arcanum.Tests.csproj -c Release
      - name: Test real Windows atomic replacement and catalog invalidation
        run: dotnet test tests/RetroDownfall.Arcanum.Tests/RetroDownfall.Arcanum.Tests.csproj -c Release --no-build --no-restore --filter "FullyQualifiedName~RetroDownfall.Arcanum.Tests.Intelligence.Spells.SpellDirectoryTests|FullyQualifiedName~RetroDownfall.Arcanum.Tests.Repositories.SpellRepositoryTests.Catalog_prewrite_scan_cannot_repopulate_current_snapshot_after_authoring" --logger "trx;LogFileName=windows-spell.trx" --results-directory .tmp/windows-spell
      - name: Retain regression evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-spell-regression
          path: .tmp/windows-spell/
