name: CI

on:
  pull_request:
  # No push trigger, deliberately. This ran on every push to main and the operator asked for it to
  # stop: the gates take over two hours on the Windows lanes, and a run nobody is waiting on is
  # a run whose red nobody reads. The cost is real and is accepted rather than hidden -- a direct
  # push to main now runs no gate at all, so coverage, the Windows suite and the AOT IL closure
  # analysis are only as current as the last dispatch or the last pull request.
  #
  # Restoring it is four lines:
  #   push:
  #     branches:
  #       - main
  workflow_dispatch:
    inputs:
      qualification:
        description: Full CI or focused Guild regression evidence
        type: choice
        required: true
        default: full
        options:
          - full
          - guild-memory
          - guild-budget

permissions:
  contents: read

# One run per branch. Before this, a push that superseded another left both queued against the same
# small pool of macOS runners, and the older run -- testing a commit nobody would act on -- took the
# slot the newer one needed. The release workflows never use cancel-in-progress: a release in
# progress must never be cancelled by whatever is dispatched next (release.yml's own groups keep it
# false, and only a run still waiting can be superseded).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Classify qualification scope
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      full: ${{ steps.classify.outputs.full }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Test qualification selection and authority
        run: python3 -m unittest scripts/tests/test_ci_scope.py scripts/tests/test_ci_scope_workflow.py

      - name: Classify tested change
        id: classify
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE: ${{ github.event.pull_request.base.sha }}
          CI_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 scripts/ci_scope.py --event "$CI_EVENT" \
            --base "$CI_BASE" --head "$GITHUB_SHA" --pr-head "$CI_PR_HEAD" >> "$GITHUB_OUTPUT"

  sdk:
    name: Select stable .NET SDK
    uses: ./.github/workflows/resolve-dotnet-sdk.yml

  native-sqlcipher-assets:
    # A RID whose hermetic SQLCipher asset is still `pending` cannot be built at all: the targets
    # raise ARCSQLC002 before CopyFilesToOutputDirectory, deliberately, with no probe and no
    # fallback. Reading the manifest here and gating the platform lanes on the result keeps a lane
    # that cannot possibly build from masquerading as a check that merely happens to be red, and
    # the lane comes back on its own the moment the asset is verified and checked in.
    name: Native SQLCipher asset status
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      win-x64: ${{ steps.manifest.outputs.win-x64 }}
      win-arm64: ${{ steps.manifest.outputs.win-arm64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the native asset manifest
        id: manifest
        run: |
          set -euo pipefail
          package=src/RetroDownfall.Arcanum.NativeSqlCipher
          for rid in win-x64 win-arm64; do
            status=$(jq -r --arg rid "$rid" '[.assets[] | select(.rid == $rid)][0].status // "absent"' "$package/native-source-manifest.json")
            path=$(jq -r --arg rid "$rid" '[.assets[] | select(.rid == $rid)][0].path // ""' "$package/native-source-manifest.json")
            if [[ "$status" == "verified" && -n "$path" && -f "$package/$path" ]]; then
              echo "$rid=verified" >> "$GITHUB_OUTPUT"
            else
              echo "$rid=$status" >> "$GITHUB_OUTPUT"
              echo "::warning::No verified hermetic SQLCipher asset for $rid (status: $status). Its CI lane is skipped; build it on a native runner with scripts/build-native-sqlcipher.ps1, verify it with scripts/verify-native-sqlcipher.sh, and check it in."
            fi
          done

  build-test:
    needs: [sdk, scope]
    if: inputs.qualification != 'guild-memory' && inputs.qualification != 'guild-budget'
    name: Build, test, coverage
    # macOS arm64, not ubuntu: the Grimoire's SQLCipher library is now built by Arcanum and shipped
    # per RID, and Linux is not a shipping RID. A Linux runner has no native asset, so the build
    # fails by design (ARCSQLC002) rather than falling back to an unverified SQLite.
    runs-on: macos-26
    # This lane took about 120 minutes on the hosted runner (the runtime suite under coverage alone
    # 1 h 45 m). The limit is about twice that, so a runner slower than the one measured still
    # finishes.
    timeout-minutes: 270
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      COVERAGE_LINE_TARGET: "80"
      COVERAGE_BRANCH_TARGET: "70"
      # The real-backend credential round trip. It was opt-in and enabled only on the Windows lane,
      # which is gated off until a verified win-x64 SQLCipher asset lands — so no lane exercised a
      # real OS secret store at all, and IOsCredentialStore shipped covered only by its in-memory
      # double. macOS Security.framework is a first-class implementation and this is a disposable
      # runner, so the round trip belongs here too. Verified on macOS: 5 skipped without this, 5
      # passed with it, against the live Keychain.
      ARCANUM_TEST_OS_CREDENTIAL_STORE: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The full suite verifies that the current admission launcher rejects known historical
          # benchmark instruments. Those immutable fixtures are commits, not duplicated files.
          fetch-depth: 0

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet
        with:
          sdk-version: ${{ needs.sdk.outputs.version }}
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            **/*.csproj
            **/Directory.Packages.props
            .config/dotnet-tools.json

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore and build Arcanum + Compendium + The Forge
        run: |
          set -euo pipefail
          # TheForge.Ux (and through it TheForge.Core) is compiled here because both release
          # workflows package and ship it; without this a compile break merges green.
          for project in \
            src/RetroDownfall.Arcanum.Cli/RetroDownfall.Arcanum.Cli.csproj \
            src/RetroDownfall.TheForge.Ux/RetroDownfall.TheForge.Ux.csproj \
            tests/RetroDownfall.Arcanum.Tests/RetroDownfall.Arcanum.Tests.csproj \
            tests/RetroDownfall.Compendium.Tests/RetroDownfall.Compendium.Tests.csproj \
            tests/RetroDownfall.TheForge.Tests/RetroDownfall.TheForge.Tests.csproj
          do
            dotnet restore "$project"
            dotnet build "$project" -c Release --no-restore
          done

      - name: Test Compendium and The Forge
        run: |
          set -euo pipefail
          # Authoritative Arcanum coverage path is coverage.sh below (do not double-run Arcanum.Tests).
          # The Forge's suite is the sole automated guard for a shipped desktop client — including the
          # markdown image loader's SSRF policy — so a whole-project exclusion here is invisible in
          # every test report. Quarantine individual tests with Skip if it ever needs it again.
          dotnet test tests/RetroDownfall.Compendium.Tests/RetroDownfall.Compendium.Tests.csproj -c Release --no-build --blame-hang-timeout 15m --blame-hang-dump-type none
          dotnet test tests/RetroDownfall.TheForge.Tests/RetroDownfall.TheForge.Tests.csproj -c Release --no-build --blame-hang-timeout 15m --blame-hang-dump-type none

      # Native packaging controls and runtime warning-scan fixtures require real ripgrep.
      # Install it before either consumer because the runner image does not ship it.
      - name: Install ripgrep
        run: command -v rg >/dev/null 2>&1 || brew install ripgrep

      # The macOS signing helpers pick an identity out of the operator's keychain, and every way
      # they can pick the wrong one still produces a signature that verifies. Drive them through
      # stubbed `security`/`codesign`. Native bundle controls additionally use ad-hoc signatures
      # on disposable fixtures; neither test path touches a real signing identity or keychain.
      - name: Test the macOS signing helpers
        if: needs.scope.outputs.full == 'true' && inputs.qualification != 'guild-memory' && inputs.qualification != 'guild-budget'
        run: ./scripts/packaging/macos/common_test.sh

      - name: Test documentation contracts
        if: needs.scope.outputs.full == 'false'
        run: |
          set -euo pipefail
          dotnet test tests/RetroDownfall.Arcanum.Tests/RetroDownfall.Arcanum.Tests.csproj \
            -c Release --no-build --no-restore --blame-hang-timeout 15m --blame-hang-dump-type none \
            --filter "FullyQualifiedName~Documentation|FullyQualifiedName~RetroDownfall.Arcanum.Tests.Build.CliInfrastructureBoundaryTests|FullyQualifiedName~RetroDownfall.Arcanum.Tests.Build.CoverageDenominatorTests|FullyQualifiedName~RetroDownfall.Arcanum.Tests.Build.RetiredServerNamespaceTests|FullyQualifiedName~RetroDownfall.Arcanum.Tests.Build.DataRetentionReasonCodeContractTests|FullyQualifiedName~RetroDownfall.Arcanum.Tests.Api.ApiWireShapeInventoryTests|FullyQualifiedName~RetroDownfall.Arcanum.Tests.Api.ErrorCodeCatalogContractTests|FullyQualifiedName~RetroDownfall.Arcanum.Tests.Cli.CliSurfaceTests|FullyQualifiedName~RetroDownfall.Arcanum.Tests.Cli.CliJsonEnvelopeContractTests|FullyQualifiedName=RetroDownfall.Arcanum.Tests.Configuration.ConstraintInventoryTests.Markdown_inventory_table_has_exact_json_row_parity|FullyQualifiedName=RetroDownfall.Arcanum.Tests.Memory.MemoryReviewContractTests.The_api_reference_enumerates_every_outcome_of_the_closed_set|FullyQualifiedName=RetroDownfall.Arcanum.Tests.Packaging.ReleasePipelineTests.The_release_concurrency_documentation_says_a_waiting_dispatch_is_superseded_not_queued|FullyQualifiedName=RetroDownfall.Arcanum.Tests.Packaging.LocalOllamaAotQualificationContractTests.Qualified_vision_fixture_digest_is_rebaselined_consistently|FullyQualifiedName=RetroDownfall.Arcanum.Tests.Packaging.LocalOllamaLongRestQualificationHarnessContractTests.The_design_states_the_corpus_size_the_recovery_rule_the_exporter_start_and_the_mutiny_scenario_as_what_they_are|FullyQualifiedName=RetroDownfall.Arcanum.Tests.Security.HostProcessToolsMarkerNativeCapabilityContractTests.The_design_marker_slot_table_names_the_windows_compare_delete_window|FullyQualifiedName=RetroDownfall.Arcanum.Tests.Build.CheckerLimitPinTests.Every_stated_limit_has_a_pin_and_the_design_still_states_it|FullyQualifiedName=RetroDownfall.Arcanum.Tests.NativeSqlCipher.NativeSqlCipherWindowsImportTableTests.A_dll_importing_the_visual_cpp_runtime_has_its_prerequisite_in_the_install_instructions|FullyQualifiedName=RetroDownfall.Arcanum.Tests.Intelligence.DciRegressionSuiteTests.The_oath_records_the_invocation_that_runs_the_dci_suite|FullyQualifiedName=RetroDownfall.Arcanum.Tests.Intelligence.ToolRiskClassifierTests.Design_ward_inventory_matches_every_known_tool_and_names_no_ward_decision"

      - name: Arcanum tests + coverage thresholds
        if: needs.scope.outputs.full == 'true' && inputs.qualification != 'guild-memory' && inputs.qualification != 'guild-budget'
        run: |
          python3 -m unittest scripts/coverage_threshold_test.py scripts/coverage_workflow_test.py scripts/hosted_producer_analysis_runner_test.py
          ./scripts/coverage.sh --threshold --ci-runtime-only

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arcanum-coverage-report
          path: |
            .tmp/coverage/report/
            .tmp/coverage/**/coverage.cobertura.xml
            .tmp/coverage/**/Sequence_*.xml
            .tmp/coverage/**/*.trx
            .tmp/coverage/analysis/
          if-no-files-found: warn
          retention-days: 14

  hosted-producer-primary-analysis:
    needs: [sdk, scope]
    if: needs.scope.outputs.full == 'true' && inputs.qualification != 'guild-memory' && inputs.qualification != 'guild-budget'
    name: Hosted producer primary analysis
    runs-on: macos-26
    timeout-minutes: 80
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet
        with:
          sdk-version: ${{ needs.sdk.outputs.version }}
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            **/*.csproj
            **/Directory.Packages.props
            .config/dotnet-tools.json

      # The lane is sized for the test host alone on a runner of about 7 GB (docs/Arcanum.DESIGN.md, Verification Memory), so no build server may
      # stay resident behind the build: the Roslyn compiler server and the MSBuild nodes of a build this size keep several GB.
      - name: Build uninstrumented source analysis
        run: dotnet build tests/RetroDownfall.Arcanum.Tests/RetroDownfall.Arcanum.Tests.csproj --configuration Release --disable-build-servers

      - name: Release build servers
        run: dotnet build-server shutdown

      - name: Test source analysis runner
        run: python3 -m unittest scripts/hosted_producer_analysis_runner_test.py

      - name: Test hosted-producer primary analysis
        timeout-minutes: 60
        run: |
          python3 scripts/hosted_producer_analysis_runner.py \
            --project tests/RetroDownfall.Arcanum.Tests/RetroDownfall.Arcanum.Tests.csproj \
            --configuration Release --jobs 2 --timeout-seconds 3540 \
            --partition primary --source-sha "$GITHUB_SHA" \
            --results-directory .tmp/coverage/analysis

      - name: Upload primary source analysis evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hosted-producer-primary-analysis
          path: .tmp/coverage/analysis/
          retention-days: 14

  hosted-producer-additional-analysis:
    needs: [sdk, scope]
    if: needs.scope.outputs.full == 'true' && inputs.qualification != 'guild-memory' && inputs.qualification != 'guild-budget'
    name: Hosted producer additional analysis
    runs-on: macos-26
    timeout-minutes: 80
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet
        with:
          sdk-version: ${{ needs.sdk.outputs.version }}
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            **/*.csproj
            **/Directory.Packages.props
            .config/dotnet-tools.json

      # The lane is sized for the test host alone on a runner of about 7 GB (docs/Arcanum.DESIGN.md, Verification Memory), so no build server may
      # stay resident behind the build: the Roslyn compiler server and the MSBuild nodes of a build this size keep several GB.
      - name: Build uninstrumented source analysis
        run: dotnet build tests/RetroDownfall.Arcanum.Tests/RetroDownfall.Arcanum.Tests.csproj --configuration Release --disable-build-servers

      - name: Release build servers
        run: dotnet build-server shutdown

      - name: Test hosted-producer additional analysis
        timeout-minutes: 60
        run: |
          python3 scripts/hosted_producer_analysis_runner.py \
            --project tests/RetroDownfall.Arcanum.Tests/RetroDownfall.Arcanum.Tests.csproj \
            --configuration Release --jobs 2 --timeout-seconds 3540 \
            --partition additional --source-sha "$GITHUB_SHA" \
            --results-directory .tmp/coverage/analysis

      - name: Upload additional source analysis evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hosted-producer-additional-analysis
          path: .tmp/coverage/analysis/
          retention-days: 14

  hosted-producer-fixture-analysis:
    needs: [sdk, scope]
    if: needs.scope.outputs.full == 'true' && inputs.qualification != 'guild-memory' && inputs.qualification != 'guild-budget'
    name: Hosted producer fixture analysis
    # One fixture process per job, whatever the slot count: the process keeps the bound production compilations in memory and a
    # standard macos-26 runner has about 7 GB, so --jobs 1 and the runner's own one-process plan agree.
    runs-on: macos-26
    timeout-minutes: 80
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet
        with:
          sdk-version: ${{ needs.sdk.outputs.version }}
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            **/*.csproj
            **/Directory.Packages.props
            .config/dotnet-tools.json

      # The lane is sized for the test host alone on a runner of about 7 GB (docs/Arcanum.DESIGN.md, Verification Memory), so no build server may
      # stay resident behind the build: the Roslyn compiler server and the MSBuild nodes of a build this size keep several GB.
      - name: Build uninstrumented source analysis
        run: dotnet build tests/RetroDownfall.Arcanum.Tests/RetroDownfall.Arcanum.Tests.csproj --configuration Release --disable-build-servers

      - name: Release build servers
        run: dotnet build-server shutdown

      - name: Test hosted-producer fixture analysis
        timeout-minutes: 60
        run: |
          python3 scripts/hosted_producer_analysis_runner.py \
            --project tests/RetroDownfall.Arcanum.Tests/RetroDownfall.Arcanum.Tests.csproj \
            --configuration Release --jobs 1 --timeout-seconds 3540 \
            --partition fixtures --source-sha "$GITHUB_SHA" \
            --results-directory .tmp/coverage/analysis

      - name: Upload fixture source analysis evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hosted-producer-fixture-analysis
          path: .tmp/coverage/analysis/
          retention-days: 14

  hosted-producer-fixture-build-analysis:
    needs: [sdk, scope]
    if: needs.scope.outputs.full == 'true' && inputs.qualification != 'guild-memory' && inputs.qualification != 'guild-budget'
    name: Hosted producer fixture build analysis
    # The fixtures marked HostedProducerBuildAnalysis: the Build scan classes and the Serve worker theories, each of which reads the production
    # source as a whole (docs/Arcanum.DESIGN.md, Verification Lanes).
    # One fixture process per job, whatever the slot count: the process keeps the bound production compilations in memory and a
    # standard macos-26 runner has about 7 GB, so --jobs 1 and the runner's own one-process plan agree.
    runs-on: macos-26
    timeout-minutes: 80
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet
        with:
          sdk-version: ${{ needs.sdk.outputs.version }}
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            **/*.csproj
            **/Directory.Packages.props
            .config/dotnet-tools.json

      # The lane is sized for the test host alone on a runner of about 7 GB (docs/Arcanum.DESIGN.md, Verification Memory), so no build server may
      # stay resident behind the build: the Roslyn compiler server and the MSBuild nodes of a build this size keep several GB.
      - name: Build uninstrumented source analysis
        run: dotnet build tests/RetroDownfall.Arcanum.Tests/RetroDownfall.Arcanum.Tests.csproj --configuration Release --disable-build-servers

      - name: Release build servers
        run: dotnet build-server shutdown

      - name: Test hosted-producer fixture build analysis
        timeout-minutes: 60
        run: |
          python3 scripts/hosted_producer_analysis_runner.py \
            --project tests/RetroDownfall.Arcanum.Tests/RetroDownfall.Arcanum.Tests.csproj \
            --configuration Release --jobs 1 --timeout-seconds 3540 \
            --partition fixtures-build --source-sha "$GITHUB_SHA" \
            --results-directory .tmp/coverage/analysis

      - name: Upload fixture build source analysis evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hosted-producer-fixture-build-analysis
          path: .tmp/coverage/analysis/
          retention-days: 14

  hosted-producer-serve-host-analysis:
    needs: [sdk, scope]
    if: needs.scope.outputs.full == 'true' && inputs.qualification != 'guild-memory' && inputs.qualification != 'guild-budget'
    name: Hosted producer serve host analysis
    # One fixture process per job, whatever the slot count: the process keeps the bound production compilations in memory and a
    # standard macos-26 runner has about 7 GB, so --jobs 1 and the runner's own one-process plan agree.
    runs-on: macos-26
    timeout-minutes: 80
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet
        with:
          sdk-version: ${{ needs.sdk.outputs.version }}
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            **/*.csproj
            **/Directory.Packages.props
            .config/dotnet-tools.json

      # The lane is sized for the test host alone on a runner of about 7 GB (docs/Arcanum.DESIGN.md, Verification Memory), so no build server may
      # stay resident behind the build: the Roslyn compiler server and the MSBuild nodes of a build this size keep several GB.
      - name: Build uninstrumented source analysis
        run: dotnet build tests/RetroDownfall.Arcanum.Tests/RetroDownfall.Arcanum.Tests.csproj --configuration Release --disable-build-servers

      - name: Release build servers
        run: dotnet build-server shutdown

      - name: Test hosted-producer serve host analysis
        timeout-minutes: 60
        run: |
          python3 scripts/hosted_producer_analysis_runner.py \
            --project tests/RetroDownfall.Arcanum.Tests/RetroDownfall.Arcanum.Tests.csproj \
            --configuration Release --jobs 1 --timeout-seconds 3540 \
            --partition serve-host --source-sha "$GITHUB_SHA" \
            --results-directory .tmp/coverage/analysis

      - name: Upload serve host source analysis evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hosted-producer-serve-host-analysis
          path: .tmp/coverage/analysis/
          retention-days: 14

  hosted-producer-analysis:
    name: Hosted producer source analysis
    needs:
      - scope
      - build-test
      - hosted-producer-primary-analysis
      - hosted-producer-additional-analysis
      - hosted-producer-fixture-analysis
      - hosted-producer-fixture-build-analysis
      - hosted-producer-serve-host-analysis
    if: always() && inputs.qualification != 'guild-memory' && inputs.qualification != 'guild-budget'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require successful selected qualification
        run: |
          set -euo pipefail
          if [[ "${{ needs.scope.result }}" != "success" || "${{ needs.build-test.result }}" != "success" ]]; then
            echo "Scope classification and selected build/test qualification must succeed." >&2
            exit 1
          fi
          case "${{ needs.scope.outputs.full }}" in
            true) expected=success ;;
            false) expected=skipped ;;
            *) echo "Missing or invalid qualification scope." >&2; exit 1 ;;
          esac
          if [[ "${{ needs.hosted-producer-primary-analysis.result }}" != "$expected" \
            || "${{ needs.hosted-producer-additional-analysis.result }}" != "$expected" \
            || "${{ needs.hosted-producer-fixture-analysis.result }}" != "$expected" \
            || "${{ needs.hosted-producer-fixture-build-analysis.result }}" != "$expected" \
            || "${{ needs.hosted-producer-serve-host-analysis.result }}" != "$expected" ]]; then
            echo "All five source analysis workers must match the selected qualification scope." >&2
            exit 1
          fi
          if [[ "$expected" == skipped ]]; then
            echo "Documentation-only contracts passed; native/runtime/source analysis was inapplicable, not executed."
          fi

      - name: Download primary source analysis evidence
        if: needs.scope.outputs.full == 'true' && inputs.qualification != 'guild-memory' && inputs.qualification != 'guild-budget'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hosted-producer-primary-analysis
          path: .tmp/coverage/analysis-primary

      - name: Download additional source analysis evidence
        if: needs.scope.outputs.full == 'true' && inputs.qualification != 'guild-memory' && inputs.qualification != 'guild-budget'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hosted-producer-additional-analysis
          path: .tmp/coverage/analysis-additional

      - name: Download fixture source analysis evidence
        if: needs.scope.outputs.full == 'true' && inputs.qualification != 'guild-memory' && inputs.qualification != 'guild-budget'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hosted-producer-fixture-analysis
          path: .tmp/coverage/analysis-fixtures

      - name: Download fixture build source analysis evidence
        if: needs.scope.outputs.full == 'true' && inputs.qualification != 'guild-memory' && inputs.qualification != 'guild-budget'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hosted-producer-fixture-build-analysis
          path: .tmp/coverage/analysis-fixtures-build

      - name: Download serve host source analysis evidence
        if: needs.scope.outputs.full == 'true' && inputs.qualification != 'guild-memory' && inputs.qualification != 'guild-budget'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hosted-producer-serve-host-analysis
          path: .tmp/coverage/analysis-serve-host

      - name: Reconcile complete source analysis evidence
        if: needs.scope.outputs.full == 'true' && inputs.qualification != 'guild-memory' && inputs.qualification != 'guild-budget'
        run: |
          python3 scripts/hosted_producer_analysis_runner.py \
            --aggregate-primary-results .tmp/coverage/analysis-primary \
            --aggregate-additional-results .tmp/coverage/analysis-additional \
            --aggregate-fixtures-results .tmp/coverage/analysis-fixtures \
            --aggregate-fixtures-build-results .tmp/coverage/analysis-fixtures-build \
            --aggregate-serve-host-results .tmp/coverage/analysis-serve-host \
            --source-sha "$GITHUB_SHA" \
            --aggregate-summary .tmp/coverage/analysis-authority/hosted-producer-analysis-summary.json

      - name: Upload source analysis authority
        if: always() && needs.scope.outputs.full == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hosted-producer-analysis-authority
          path: .tmp/coverage/analysis-authority/
          if-no-files-found: warn
          retention-days: 14

  macos-workspace-check:
    needs: [sdk, scope]
    if: needs.scope.outputs.full == 'true' && inputs.qualification != 'guild-memory' && inputs.qualification != 'guild-budget'
    name: macOS workspace-check runtime
    runs-on: macos-26
    timeout-minutes: 120
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      ARCANUM_REQUIRE_MACOS_WORKSPACE_CHECK: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet
        with:
          sdk-version: ${{ needs.sdk.outputs.version }}
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            **/*.csproj
            **/Directory.Packages.props
            .config/dotnet-tools.json

      - name: Pin trusted root-owned dotnet host
        run: |
          set -euo pipefail
          test -n "${DOTNET_ROOT:-}"
          sudo rm -rf /opt/dotnet
          sudo mkdir -p /opt/dotnet
          sudo cp -R "$DOTNET_ROOT/." /opt/dotnet/
          sudo chown -R root:wheel /opt/dotnet
          sudo chmod -R go-w /opt/dotnet
          /opt/dotnet/dotnet --info

      - name: Build Arcanum tests
        run: |
          dotnet restore tests/RetroDownfall.Arcanum.Tests/RetroDownfall.Arcanum.Tests.csproj
          dotnet build tests/RetroDownfall.Arcanum.Tests/RetroDownfall.Arcanum.Tests.csproj -c Release --no-restore

      - name: Exercise production workspace-check jail
        run: |
          dotnet test tests/RetroDownfall.Arcanum.Tests/RetroDownfall.Arcanum.Tests.csproj \
            -c Release \
            --no-build \
            --no-restore \
            --blame-hang-timeout 15m \
            --blame-hang-dump-type none \
            --filter "FullyQualifiedName~Macos_ci_requires_real_workspace_check_production_surface|FullyQualifiedName~MacOsSandbox_DeniesLaunchServicesBrokerEscape|FullyQualifiedName~Real_dotnet_build_uses_seeded_assets|FullyQualifiedName~Real_dotnet_lint_uses_seeded_project_state|FullyQualifiedName~Real_dotnet_test_uses_seeded_assets|FullyQualifiedName~Ci_has_packaged_sqlcipher_native_asset"

      # verify-aot-il-warnings.sh fails closed without ripgrep, which the runner image does
      # not ship. Install it explicitly rather than letting the gate refuse to run.
      - name: Install ripgrep
        run: command -v rg >/dev/null 2>&1 || brew install ripgrep

      - name: Verify macOS AOT IL warnings and search regex smoke
        run: ./scripts/verify-aot-il-warnings.sh

      - name: Build the prompt cache benchmark host
        run: >-
          dotnet build tests/RetroDownfall.Arcanum.PromptCache.Benchmarks/RetroDownfall.Arcanum.PromptCache.Benchmarks.csproj
          -c Debug --no-incremental -p:RestoreLockedMode=true

      - name: Exercise the Native AOT prompt cache fixture
        run: ./scripts/benchmark-prompt-cache.sh --smoke --record prompt-cache-fixture.json

      - name: Upload the prompt cache fixture report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prompt-cache-fixture
          path: prompt-cache-fixture.json*
          if-no-files-found: warn
          retention-days: 90

      - name: Build the Grimoire admission benchmark host
        run: >-
          dotnet build tests/RetroDownfall.Arcanum.GrimoireAdmission.Benchmarks/RetroDownfall.Arcanum.GrimoireAdmission.Benchmarks.csproj
          -c Debug --no-incremental -p:RestoreLockedMode=true

      - name: Smoke the Native AOT Grimoire admission benchmark
        run: ./scripts/benchmark-grimoire-admission.sh --smoke

      # The benchmark host is outside RetroDownfall.Arcanum.slnx, so nothing else in this workflow
      # compiles it. The gate below publishes it in Release, but a publish that fails reports as a
      # gate failure rather than as a compile break, and an incremental build hides the analyzer
      # diagnostics a clean one raises. Naming the project here is also what puts it inside the
      # compiled-project closure ContinuousIntegrationWorkflowTests walks.
      - name: Test the Covenant benchmark launcher
        run: python3 -m unittest scripts/tests/test_benchmark_covenant_launcher.py -v

      - name: Build the Covenant benchmark host
        run: |
          dotnet build tests/RetroDownfall.Arcanum.Covenant.Benchmarks/RetroDownfall.Arcanum.Covenant.Benchmarks.csproj \
            -c Debug \
            --no-incremental

      # The gate runs here too: its absolute ceilings carry enough headroom for a shared runner, and a
      # breach on this lane is the signal it exists to give. The run is recorded as well as gated, so
      # the lane leaves behind the observed distribution its headroom is justified against; without an
      # artifact the margin between what a shared runner measures and what the ceilings allow is a
      # claim nobody can check.
      - name: Covenant benchmark gate
        run: ./scripts/benchmark-covenant.sh --gate --record covenant-benchmark-run.json

      # Retention-pinned and unconditional: the gate step above exits 1 on a ceiling breach, and the
      # breaching run is the one whose distribution is most worth reading. The host writes the JSON
      # before it evaluates the gate, so the file is there either way. `if: always()` is a step-level
      # key, which the job parser ContinuousIntegrationWorkflowTests uses ignores -- it filters to
      # job-level indentation before it reads a key -- so this does not mark the job conditional and
      # does not exempt it from the native-SQLCipher runner check, exactly as the same condition on
      # the coverage upload in build-test already does not.
      - name: Upload the Covenant benchmark run
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: covenant-benchmark-run
          path: covenant-benchmark-run.json
          if-no-files-found: warn
          retention-days: 90

  windows-suite:
    # Focused native/OS contracts run on each shipping Windows architecture. Portable runtime
    # coverage is authoritative on macOS; ARM64 also checks actual Windows compiler inputs.
    #
    # The bare name is left alone on purpose. A repository's required-status-check configuration
    # refers to a workflow lane by this exact string, external to this file, so renaming it would
    # silently break whatever branch protection names it.
    name: Windows test suite
    # The hermetic SQLCipher targets refuse to build a RID whose asset is not verified (ARCSQLC002)
    # long before the first test executes. Gate on the manifest so a lane in that state skips
    # honestly instead of failing at `dotnet build`, and returns by itself once the asset lands.
    # The gate stays now that win-x64's asset is checked in: nothing in the job would run without
    # it, so the condition is the honest statement of the prerequisite rather than a leftover.
    needs: [sdk, native-sqlcipher-assets, scope]
    if: needs.scope.outputs.full == 'true' && inputs.qualification != 'guild-memory' && inputs.qualification != 'guild-budget' && needs.native-sqlcipher-assets.outputs.win-x64 == 'verified'
    runs-on: windows-latest
    # Budget for native builds, separate diagnostic and shipping AOT publishes, executable
    # smokes and the Windows/Long Rest suites, with headroom for hosted-runner variability.
    timeout-minutes: 270
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      # Turns a lane that silently skipped everything into a red build. See WindowsCiSurfaceTests.
      ARCANUM_REQUIRE_WINDOWS_SUITE: true
      ARCANUM_EXPECTED_WINDOWS_RID: win-x64
      # The credential round-trip is the one test that writes to a real OS secret store, so it is
      # opt-in and stays off on developer machines. A disposable runner is where it belongs.
      ARCANUM_TEST_OS_CREDENTIAL_STORE: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet
        with:
          sdk-version: ${{ needs.sdk.outputs.version }}
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            **/*.csproj
            **/Directory.Packages.props
            .config/dotnet-tools.json

      - name: Assert the SDK is native to win-x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $info = (& dotnet --info) -join "`n"
          Write-Host $info
          New-Item -ItemType Directory -Force '.tmp/windows-long-rest-win-x64' | Out-Null
          $info | Set-Content -LiteralPath '.tmp/windows-long-rest-win-x64/sdk-info.txt' -Encoding utf8
          $match = [regex]::Match($info, '(?m)^\s*RID:\s*(?<rid>\S+)\s*$')
          if (-not $match.Success) { throw 'dotnet --info did not report a host RID.' }
          if ($match.Groups['rid'].Value -ne 'win-x64') {
            throw "This lane must run a win-x64 SDK; actual host RID: $($match.Groups['rid'].Value)."
          }

      - name: Restore and build Arcanum + Compendium
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The Forge's suite runs once, on build-test; this lane exists for the Windows-gated
          # Arcanum surface, so re-running a platform-agnostic suite here would buy nothing.
          foreach ($project in @(
            'tests/RetroDownfall.Arcanum.Tests/RetroDownfall.Arcanum.Tests.csproj',
            'tests/RetroDownfall.Compendium.Tests/RetroDownfall.Compendium.Tests.csproj'
          )) {
            dotnet restore $project
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            dotnet build $project -c Release --no-restore
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      # The AOT diagnostic gate fails closed when ripgrep is absent. Windows runner images do not
      # promise it, so install the pinned fallback before asking the gate to classify diagnostics.
      - name: Install ripgrep
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if (-not (Get-Command rg -CommandType Application -ErrorAction SilentlyContinue)) {
            choco install ripgrep --version=15.2.0 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          rg --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The shipping publish below is warning-free because it suppresses dependency summary
      # diagnostics after this gate has classified the detailed warnings. Run the diagnostic profile
      # on this native architecture first, or a win-x64-only first-party warning is invisible.
      - name: Audit win-x64 Native AOT diagnostics
        shell: bash
        run: |
          set -euo pipefail
          rg --version
          ./scripts/verify-aot-il-warnings.sh win-x64

      - name: Verify Guild Native AOT graph (win-x64)
        shell: bash
        run: ./scripts/verify-guild-aot.sh --rid win-x64

      # The broker smoke re-executes this exact retained, warning-free shipping apphost after
      # its provider-contract smoke succeeds. A fresh parent gives the verifier a nonexistent leaf.
      - name: Verify warning-free win-x64 shipping executable and provider-contract smoke
        shell: bash
        run: |
          set -euo pipefail
          runner_temp="$(cygpath -u "$RUNNER_TEMP")"
          retained_parent="$(mktemp -d "$runner_temp/arcanum-shipping-win-x64.XXXXXX")"
          retained_publish="$retained_parent/publish"
          ./scripts/verify-shipping-publish.sh --rid win-x64 --retain-publish-dir "$retained_publish"
          executable="$retained_publish/RetroDownfall.Arcanum.Cli.exe"
          if [[ ! -f "$executable" ]]; then
            echo "error: expected retained shipping apphost not found: $executable" >&2
            exit 1
          fi
          windows_executable="$(cygpath -w "$executable")"
          printf 'ARCANUM_PUBLISHED_EXECUTABLE=%s\n' "$windows_executable" >> "$GITHUB_ENV"

      - name: Test Arcanum
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Keep the native/OS surface explicit; portable runtime coverage runs on macOS. Every test
          # that skips unless the host is Windows must be selected here, by class or exact name
          # (ContinuousIntegrationWorkflowTests.Every_windows_gated_test_is_selected_by_both_windows_lanes).
          # The AI reflection guard also inspects this architecture's complete compiled production closure.
          dotnet test tests/RetroDownfall.Arcanum.Tests/RetroDownfall.Arcanum.Tests.csproj `
            -c Release --no-build --no-restore --blame-hang-timeout 15m --blame-hang-dump-type none --filter "Category!=Perf&Category!=HostedProducerAnalysis&(FullyQualifiedName~AiReflection|FullyQualifiedName~RetroDownfall.Arcanum.Tests.Platform.WindowsCiSurfaceTests|FullyQualifiedName~RetroDownfall.Arcanum.Tests.NativeSqlCipher.NativeSqlCipherDeliveryTests|FullyQualifiedName~RetroDownfall.Arcanum.Tests.NativeSqlCipher.SqlCipherCompatibilityTests|FullyQualifiedName~RetroDownfall.Arcanum.Tests.Security.OsCredentialStoreRoundTripTests|FullyQualifiedName~RetroDownfall.Arcanum.Tests.Platform.ProcessResourceLimiterWindowsBehaviorTests|FullyQualifiedName~RetroDownfall.Arcanum.Tests.Platform.WindowsJobObjectSessionTests|FullyQualifiedName~RetroDownfall.Arcanum.Tests.Process.WindowsAppContainerPolicyTests|FullyQualifiedName~RetroDownfall.Arcanum.Tests.Process.WindowsAppContainerRestoreJournalTests|FullyQualifiedName~RetroDownfall.Arcanum.Tests.Process.WindowsAppContainerBrokerTests|FullyQualifiedName~RetroDownfall.Arcanum.Tests.Process.WindowsAppContainerAclTests|FullyQualifiedName~RetroDownfall.Arcanum.Tests.Process.WindowsBrokerTargetResolverTests|FullyQualifiedName~RetroDownfall.Arcanum.Tests.Process.ChildProcessSandboxRootsTests|FullyQualifiedName~RetroDownfall.Arcanum.Tests.Process.WindowsAppContainerJobAssignmentTests|FullyQualifiedName~RetroDownfall.Arcanum.Tests.Process.WindowsAppContainerBrokerExitTests|FullyQualifiedName~RetroDownfall.Arcanum.Tests.Process.WindowsAppContainerRootLockBudgetTests|FullyQualifiedName~RetroDownfall.Arcanum.Tests.Process.ChildProcessBoundaryBehaviorTests|FullyQualifiedName~RetroDownfall.Arcanum.Tests.Process.ChildProcessFilesystemJailTests|FullyQualifiedName~RetroDownfall.Arcanum.Tests.Process.CappedChildProcessRunnerStandardInputTests|FullyQualifiedName~RetroDownfall.Arcanum.Tests.Familiars.FamiliarExecutableResolverTests|FullyQualifiedName~RetroDownfall.Arcanum.Tests.Intelligence.Spells.SpellDirectoryTests|FullyQualifiedName~RetroDownfall.Arcanum.Tests.Repositories.SpellRepositoryTests|FullyQualifiedName~RetroDownfall.Arcanum.Tests.Workspaces.SpellScannerTests|FullyQualifiedName=RetroDownfall.Arcanum.Tests.GrimoireTransitions.GrimoireOfflineTransitionJournalFileStoreTests.Windows_delete_durably_succeeds_after_publication|FullyQualifiedName=RetroDownfall.Arcanum.Tests.GrimoireTransitions.GrimoireOfflineTransitionJournalFileStoreTests.Windows_read_fails_closed_when_the_published_file_acl_is_weakened|FullyQualifiedName=RetroDownfall.Arcanum.Tests.Cli.FullInstallationResetAttestationFileReaderTests.Reader_rejects_a_file_not_controlled_only_by_the_current_owner|FullyQualifiedName=RetroDownfall.Arcanum.Tests.Mcp.WorkspacePathPolicySymlinkTests.IsPathUnderWorkspace_OnWindows_IgnoresDirectoryNameCase|FullyQualifiedName=RetroDownfall.Arcanum.Tests.Platform.ProcessResourceLimiterTests.Apply_returns_assign_after_start_on_windows|FullyQualifiedName=RetroDownfall.Arcanum.Tests.Security.HttpsCertificateLoaderTests.Load_PemPair_OnWindows_ZeroesTheExportedPkcs12Buffer|FullyQualifiedName=RetroDownfall.Arcanum.Tests.Security.SecureFileReaderTests.TryOpenRegularFile_on_windows_rejects_reparse_symlink|FullyQualifiedName=RetroDownfall.Arcanum.Tests.Workspaces.PhysicalFileSystemBrowserTests.ListAsync_And_ReadAsync_NormalizeBackslashesInRelativePaths_OnWindows|FullyQualifiedName=RetroDownfall.Arcanum.Tests.Diagnostics.MaintenanceLockCheckTests.Windows_read_only_stale_lock_is_degraded_and_its_bytes_are_unchanged|FullyQualifiedName=RetroDownfall.Arcanum.Tests.GrimoireTransitions.GrimoireOfflineTransitionJournalFileStoreTests.Windows_compare_unlink_removes_the_name_while_the_retained_evidence_handle_stays_readable|FullyQualifiedName=RetroDownfall.Arcanum.Tests.GrimoireTransitions.GrimoireOfflineTransitionJournalFileStoreTests.Windows_real_primitives_reinspect_then_publish_a_new_working_file|FullyQualifiedName=RetroDownfall.Arcanum.Tests.GrimoireTransitions.GrimoireOfflineTransitionJournalFileStoreTests.Windows_no_replac