name: Private beta release (Windows / Linux)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer (e.g. 0.1.0-beta.1). No +build metadata."
        required: true
        type: string

permissions:
  contents: read

jobs:
  native-sqlcipher-assets:
    # A RID whose hermetic SQLCipher asset is not checked in and verified cannot be built at all:
    # the targets raise ARCSQLC002 before CopyFilesToOutputDirectory, deliberately, with no probe
    # and no fallback. This workflow is workflow_dispatch:-only, so no pull request ever reports
    # that breakage -- without this gate an operator discovers it at the moment they reach for a
    # release. Read the manifest, skip honestly, and resume with zero workflow edits the moment an
    # asset is verified and checked in.
    #
    # linux-x64 is absent from the manifest by design, not by omission: Linux is not a shipping RID
    # (docs/Arcanum.DESIGN.md 5.4.4a), which is why package-linux.sh exits 2 with that same
    # guidance. The job is gated rather than deleted so that restoring Linux follows the path that
    # design note already describes -- add the RID, build and verify its asset on a native runner,
    # check it in -- with no workflow edit left to remember.
    name: Native SQLCipher asset status
    runs-on: ubuntu-latest
    outputs:
      win-x64: ${{ steps.manifest.outputs.win-x64 }}
      linux-x64: ${{ steps.manifest.outputs.linux-x64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Read the native asset manifest
        id: manifest
        run: |
          set -euo pipefail
          package=src/RetroDownfall.Arcanum.NativeSqlCipher
          for rid in win-x64 linux-x64; do
            status=$(jq -r --arg rid "$rid" '[.assets[] | select(.rid == $rid)][0].status // "absent"' "$package/native-source-manifest.json")
            path=$(jq -r --arg rid "$rid" '[.assets[] | select(.rid == $rid)][0].path // ""' "$package/native-source-manifest.json")
            if [[ "$status" == "verified" && -n "$path" && -f "$package/$path" ]]; then
              echo "$rid=verified" >> "$GITHUB_OUTPUT"
            else
              echo "$rid=$status" >> "$GITHUB_OUTPUT"
              echo "::warning::No verified hermetic SQLCipher asset for $rid (status: $status). Its packaging job is skipped; add the RID to native-source-manifest.json if absent, build it on a native runner with scripts/build-native-sqlcipher.sh or .ps1, verify it with scripts/verify-native-sqlcipher.sh, and check it in."
            fi
          done

  package-linux:
    name: Package Linux x64
    # Linux is not a shipping RID, so there is no linux-x64 asset and package-linux.sh exits 2 by
    # design. Gate on the manifest so this job skips honestly instead of failing every dispatch.
    needs: native-sqlcipher-assets
    if: needs.native-sqlcipher-assets.outputs.linux-x64 == 'verified'
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"

      - name: Validate version
        id: ver
        env:
          # Never interpolate a workflow_dispatch input into the run: script — the templating
          # engine expands it into the shell source, so injected commands execute before the
          # SemVer validation below can reject them. Read it from the environment instead.
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="$VERSION_INPUT"
          if [[ "$VERSION" == *+* ]]; then
            echo "error: SemVer build metadata (+...) is not allowed: '$VERSION'" >&2
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "error: invalid SemVer '$VERSION'" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package Linux artifacts
        run: |
          set -euo pipefail
          chmod +x ./scripts/packaging/linux/package-linux.sh
          mkdir -p dist/linux
          ./scripts/packaging/linux/package-linux.sh \
            --version "${{ steps.ver.outputs.version }}" \
            --output-dir ./dist/linux \
            --rid linux-x64

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: private-beta-linux-x64
          path: dist/linux/
          if-no-files-found: error

  package-windows:
    name: Package Windows x64
    # win-x64 has no verified hermetic SQLCipher asset yet, and the targets refuse to build a RID
    # without one (ARCSQLC002) long before packaging starts. Gate on the manifest so the job skips
    # honestly instead of failing at `dotnet build`, and returns by itself once the asset lands.
    needs: native-sqlcipher-assets
    if: needs.native-sqlcipher-assets.outputs.win-x64 == 'verified'
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"

      - name: Validate version
        id: ver
        shell: bash
        env:
          # Never interpolate a workflow_dispatch input into the run: script — the templating
          # engine expands it into the shell source, so injected commands execute before the
          # SemVer validation below can reject them. Read it from the environment instead.
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="$VERSION_INPUT"
          if [[ "$VERSION" == *+* ]]; then
            echo "error: SemVer build metadata (+...) is not allowed: '$VERSION'" >&2
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "error: invalid SemVer '$VERSION'" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package Windows artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\windows | Out-Null
          .\scripts\packaging\windows\package-windows.ps1 `
            -Version "${{ steps.ver.outputs.version }}" `
            -OutputDir .\dist\windows

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: private-beta-win-x64
          path: dist/windows/
          if-no-files-found: error
